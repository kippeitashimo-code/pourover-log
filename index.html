<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pourover Log</title>

  <!-- ============================================================
       STYLES (CSS): how the page looks
       ============================================================ -->
  <style>
    :root {
      --bg: #f7f3ee;
      --card: #ffffff;
      --text: #2b2420;
      --muted: #8a7f76;
      --line: #e6ded5;
      --accent: #8b5a3c;
      --accent-soft: #f1e6dc;
      --danger: #b23b3b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --card: #262220;
        --text: #f1ebe5;
        --muted: #a39890;
        --line: #3a3430;
        --accent: #d49a6a;
        --accent-soft: #3a2e26;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 960px; margin: 0 auto;
      padding: 24px max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left));
    }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.6rem; }
    h1 span { color: var(--accent); }

    button {
      font: inherit; cursor: pointer; border-radius: 8px;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      padding: 8px 14px;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--danger); }
    button.small { padding: 4px 10px; font-size: .85rem; }

    input, select, textarea {
      font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    textarea { resize: vertical; min-height: 60px; }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }

    /* Search & filter bar */
    .filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin: 20px 0; }
    @media (max-width: 640px) { .filters { grid-template-columns: 1fr 1fr; } .filters .search { grid-column: 1 / -1; } }

    /* Recipe cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px; cursor: pointer; transition: border-color .15s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { margin: 0 0 2px; font-size: 1.05rem; }
    .card .sub { color: var(--muted); font-size: .85rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
    .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: .8rem; }
    .stars { color: var(--accent); letter-spacing: 2px; }
    .empty { text-align: center; color: var(--muted); padding: 60px 0; }

    /* Grid / List switch: a single icon button showing the *other* view */
    .icon-btn { display: flex; align-items: center; justify-content: center; padding: 8px 10px; }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    /* Floating "+" button (phones only) with a menu that slides up out of it */
    .fab {
      display: none; position: fixed; z-index: 10;
      right: calc(20px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
    }
    .fab-btn {
      position: relative; z-index: 1; width: 56px; height: 56px; padding: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff; border: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s;
    }
    .fab-btn:active { transform: scale(.94); }
    .fab-btn svg {
      width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round;
      transition: transform .25s cubic-bezier(.2, .8, .2, 1);
    }
    .fab.open .fab-btn svg { transform: rotate(45deg); }
    .fab-item {
      position: absolute; right: 0; bottom: 7px; white-space: nowrap;
      border-radius: 999px; padding: 10px 18px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
      /* Closed: tucked behind the + button, small and invisible */
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(0) scale(.6); transform-origin: right center;
      transition: transform .22s cubic-bezier(.4, 0, .2, 1), opacity .18s ease, visibility 0s linear .22s;
    }
    .fab.open .fab-item {
      /* Open: each item (--i = 1, 2…) slides up to its own spot above the + button */
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: translateY(calc(var(--i) * -54px - 10px)) scale(1);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1) calc((var(--i) - 1) * 40ms),
                  opacity .2s ease calc((var(--i) - 1) * 40ms), visibility 0s;
    }
    @media (max-width: 640px) {
      .fab { display: block; }
      #newBtn, #importBtn { display: none; } /* the floating button covers these on phones */
      .wrap { padding-bottom: calc(110px + env(safe-area-inset-bottom)); } /* last card stays clear of it */
    }
    @media (prefers-reduced-motion: reduce) {
      .fab-item, .fab-btn svg { transition-duration: .01s !important; transition-delay: 0s !important; }
    }

    /* List view (table) — scrolls sideways on its own on small screens */
    .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: .8rem; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--accent-soft); }
    tbody tr:last-child td { border-bottom: none; }

    /* Form popup (dialog) */
    dialog {
      border: none; border-radius: 14px; padding: 0; width: min(720px, calc(100% - 32px));
      background: var(--card); color: var(--text);
    }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .dlg-head h2 { margin: 0; font-size: 1.2rem; }
    .dlg-body { padding: 16px 20px; max-height: 70vh; overflow-y: auto; }
    .dlg-foot { display: flex; justify-content: space-between; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
    fieldset { border: none; padding: 0; margin: 0 0 20px; }
    legend { font-weight: 600; margin-bottom: 10px; color: var(--accent); }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .ratio { font-size: .9rem; color: var(--muted); }
    .inline { display: flex; gap: 6px; }
    .inline select { width: auto; }
    .cal { position: relative; flex: none; }
    .cal button { height: 100%; padding: 0 10px; display: flex; align-items: center; }
    .cal button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    /* Invisible native date input, only used to show the calendar popup */
    .cal input[type="date"] { position: absolute; inset: 0; opacity: 0; pointer-events: none; padding: 0; }
    .date-input:invalid { border-color: var(--danger); }

    /* Pour schedule rows */
    .pour { display: grid; grid-template-columns: 80px 90px 1fr 32px; gap: 8px; margin-bottom: 6px; align-items: center; }
    .pour button { padding: 6px; }

    /* Star rating picker */
    .rating-pick button { border: none; background: none; font-size: 1.5rem; padding: 0 2px; color: var(--line); }
    .rating-pick button.on { color: var(--accent); }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    [hidden] { display: none !important; }

    /* Sign-in screen */
    .auth-wrap { padding: 0 16px; }
    .auth {
      max-width: 380px; margin: 12vh auto 0; padding: 24px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    }
    .auth h1 { margin-bottom: 4px; }
    .auth p { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
    .auth .field { margin-bottom: 12px; }
    .auth .actions { display: flex; gap: 8px; margin-top: 16px; }
    .auth .actions button { flex: 1; }
    .auth .msg { margin-top: 14px; font-size: .9rem; }
    .msg.err, .account .err { color: var(--danger); }

    /* Signed-in bar under the header */
    .account {
      display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-top: 10px; font-size: .85rem; color: var(--muted);
    }
  </style>
</head>
<body>
  <!-- ============================================================
       PAGE STRUCTURE (HTML): what's on the page
       ============================================================ -->
  <!-- Sign-in screen, shown when you're logged out -->
  <div class="auth-wrap" id="authView" hidden>
    <form class="auth" id="authForm">
      <h1>Pourover <span>Log</span></h1>
      <p>Sign in to see your brews on any device.</p>
      <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></div>
      <div class="actions">
        <button type="submit" class="primary" id="signInBtn">Sign in</button>
        <button type="button" id="signUpBtn">Create account</button>
      </div>
      <div class="msg" id="authMsg"></div>
    </form>
  </div>

  <div class="wrap" id="appView" hidden>
    <header>
      <h1>Pourover <span>Log</span></h1>
      <div class="toolbar">
        <button type="button" class="icon-btn" id="viewToggle"></button>
        <button id="exportBtn" class="icon-btn" title="Export a backup file" aria-label="Export a backup file">
          <svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2"/></svg>
        </button>
        <button id="importBtn" title="Load a backup file">Import</button>
        <input type="file" id="importFile" accept=".json" hidden>
        <button class="primary" id="newBtn">+ New brew</button>
      </div>
    </header>
    <div class="account">
      <span id="syncStatus"></span>
      <span id="userEmail"></span>
      <button class="small" id="logoutBtn">Log out</button>
    </div>

    <div class="filters">
      <div class="search">
        <label for="q">Search</label>
        <input id="q" placeholder="Bean, roaster, origin, notes…">
      </div>
      <div>
        <label for="fBrewer">Brewer</label>
        <select id="fBrewer"><option value="">All</option></select>
      </div>
      <div>
        <label for="fRating">Min rating</label>
        <select id="fRating">
          <option value="0">Any</option>
          <option value="3">★★★+</option>
          <option value="4">★★★★+</option>
          <option value="5">★★★★★</option>
        </select>
      </div>
      <div>
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="rating">Rating</option>
        </select>
      </div>
    </div>

    <div id="list" class="grid"></div>

    <!-- Floating + button for phones; its menu slides up out of it -->
    <div class="fab" id="fab">
      <button type="button" class="fab-item" id="fabImport" style="--i: 2" tabindex="-1">Import</button>
      <button type="button" class="fab-item primary" id="fabNew" style="--i: 1" tabindex="-1">New brew</button>
      <button type="button" class="fab-btn" id="fabBtn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <!-- The add/edit form, shown as a popup -->
  <dialog id="dlg">
    <form id="form" method="dialog">
      <div class="dlg-head">
        <h2 id="dlgTitle">New brew</h2>
        <button type="button" class="small" id="closeBtn">✕</button>
      </div>

      <div class="dlg-body">
        <fieldset>
          <legend>Coffee</legend>
          <div class="row">
            <div><label>Bean / name</label><input name="bean" required placeholder="e.g. Kochere"></div>
            <div><label>Roaster</label><input name="roaster"></div>
            <div><label>Variety</label><input name="variety" list="varietyList" placeholder="Gesha, SL28…" autocomplete="off"></div>
          </div>
          <div class="row">
            <div><label>Origin</label><input name="origin" list="countryList" placeholder="Start typing a country…" autocomplete="off"></div>
            <div><label>Process</label><input name="process" list="processList" placeholder="Washed, Natural…"></div>
            <div><label>Roast date</label><div class="inline date-field"><input name="roastDate" class="date-input" inputmode="numeric" placeholder="yyyy/mm/dd"></div></div>
            <div><label>Brew date</label><div class="inline date-field"><input name="brewDate" class="date-input" inputmode="numeric" placeholder="yyyy/mm/dd"></div></div>
          </div>
          <datalist id="processList">
            <option>Washed</option><option>Natural</option><option>Honey</option><option>Anaerobic</option>
          </datalist>
          <datalist id="countryList"></datalist>
          <datalist id="varietyList"></datalist>
        </fieldset>

        <fieldset>
          <legend>Recipe</legend>
          <div class="row">
            <div><label>Dose (g)</label><input name="dose" type="number" step="0.1" min="0"></div>
            <div><label>Water (g)</label><input name="water" type="number" step="1" min="0"></div>
            <div><label>Ratio</label><div class="ratio" id="ratioOut">—</div></div>
          </div>
          <div class="row">
            <div><label>Brewer</label><input name="brewer" list="brewerList" placeholder="V60, Kalita…"></div>
            <div><label>Grinder</label><input name="grinder" list="grinderList"></div>
            <div><label>Grind setting</label><input name="grind"></div>
          </div>
          <div class="row">
            <div>
              <label>Water temp</label>
              <div class="inline">
                <input name="temp" type="number" step="0.5">
                <select name="tempUnit" id="tempUnit">
                  <option value="C">°C</option>
                  <option value="F">°F</option>
                </select>
              </div>
            </div>
            <div><label>Total time</label><input name="time" class="time-input" inputmode="numeric" placeholder="type 300 → 3:00"></div>
          </div>
          <datalist id="brewerList"></datalist>
          <datalist id="grinderList"></datalist>
        </fieldset>

        <fieldset>
          <legend>Pour schedule</legend>
          <div class="pour" style="font-size:.8rem;color:var(--muted)">
            <span>Time</span><span>To (g)</span><span>Note</span><span></span>
          </div>
          <div id="pours"></div>
          <button type="button" class="small" id="addPour">+ Add pour</button>
        </fieldset>

        <fieldset>
          <legend>Tasting</legend>
          <label>Rating</label>
          <div class="rating-pick" id="ratingPick"></div>
          <div style="margin-top:10px"><label>Tasting notes</label><textarea name="notes" placeholder="Jasmine, bergamot, clean finish…"></textarea></div>
          <div style="margin-top:10px"><label>Next time, change…</label><textarea name="nextTime" placeholder="Grind a little finer"></textarea></div>
        </fieldset>
      </div>

      <div class="dlg-foot">
        <div class="toolbar">
          <button type="button" class="danger" id="deleteBtn">Delete</button>
          <button type="button" id="dupBtn" title="Copy this recipe as a new brew">Brew again</button>
        </div>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- ============================================================
       BEHAVIOR (JavaScript): what happens when you click things
       ============================================================ -->
  <!-- Supabase library: talks to the online database and handles logins -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // ---------- Connection to the online database (Supabase) ----------
    // These two values are safe to be public: the database only lets each
    // signed-in user read and change their own brews (see supabase/setup.sql).
    const SUPABASE_URL = 'https://ixiyhlvcobbdbevhxgok.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5QIBbcSz1AZT5Sjk5YUH3w_adVdt-ix';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Where brews were kept before syncing existed (only used for the one-time upload)
    const OLD_STORAGE_KEY = 'pourover-log-v1';

    let user = null;
    let brews = [];

    // A copy of your brews is also kept in this browser, so the app opens instantly
    const cacheKey = () => `pourover-log-cache-${user.id}`;
    function loadCache() {
      try { return JSON.parse(localStorage.getItem(cacheKey())) || []; }
      catch { return []; }
    }
    function cacheBrews() {
      try { localStorage.setItem(cacheKey(), JSON.stringify(brews)); } catch {}
    }

    function setStatus(text, isError = false) {
      $('syncStatus').textContent = text;
      $('syncStatus').className = isError ? 'err' : '';
    }

    // ---------- Reading & writing brews online ----------
    async function fetchBrews() {
      setStatus('Syncing…');
      const { data, error } = await db.from('brews').select('id, data');
      if (error) return setStatus('Offline: showing the last synced copy', true);
      brews = data.map(row => ({ ...row.data, id: row.id }));
      cacheBrews();
      render();
      setStatus('Synced');
    }

    async function uploadBrews(list) {
      setStatus('Saving…');
      const rows = list.map(({ id, ...data }) => ({ id, data, updated_at: new Date().toISOString() }));
      const { error } = await db.from('brews').upsert(rows);
      if (error) {
        setStatus('Not saved: check your connection', true);
        return false;
      }
      setStatus('Synced');
      return true;
    }

    async function deleteBrewOnline(id) {
      setStatus('Saving…');
      const { error } = await db.from('brews').delete().eq('id', id);
      setStatus(error ? 'Delete failed: check your connection' : 'Synced', !!error);
    }

    // First sign-in on a browser that already has brews saved: offer to upload them
    async function offerLocalUpload() {
      let local = [];
      try { local = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY)) || []; } catch {}
      if (!local.length) return;
      if (!confirm(`Found ${local.length} brew(s) saved in this browser. Upload them to your account?`)) return;
      if (await uploadBrews(local)) {
        // Keep a backup copy under a new name instead of deleting it outright
        try {
          localStorage.setItem(OLD_STORAGE_KEY + '-uploaded', JSON.stringify(local));
          localStorage.removeItem(OLD_STORAGE_KEY);
        } catch {}
      }
    }

    // ---------- Signing in & out ----------
    async function showSignedIn() {
      $('authView').hidden = true;
      $('appView').hidden = false;
      $('userEmail').textContent = user.email;
      brews = loadCache();
      render();
      await offerLocalUpload();
      await fetchBrews();
    }

    function showSignedOut() {
      $('appView').hidden = true;
      $('authView').hidden = false;
      brews = [];
    }

    db.auth.onAuthStateChange((event, session) => {
      const newUser = session?.user || null;
      // A token refresh for the same person: nothing to do (but always draw the first screen)
      if (event !== 'INITIAL_SESSION' && newUser?.id === user?.id) return;
      user = newUser;
      // setTimeout lets Supabase finish its own work before we query the database
      setTimeout(() => user ? showSignedIn() : showSignedOut(), 0);
    });

    function authMessage(text, isError = false) {
      $('authMsg').textContent = text;
      $('authMsg').className = 'msg' + (isError ? ' err' : '');
    }

    $('authForm').onsubmit = async (e) => {
      e.preventDefault();
      authMessage('Signing in…');
      const { error } = await db.auth.signInWithPassword({
        email: $('authEmail').value.trim(),
        password: $('authPassword').value,
      });
      authMessage(error ? error.message : '', !!error);
    };

    $('signUpBtn').onclick = async () => {
      if (!$('authForm').reportValidity()) return;
      authMessage('Creating account…');
      const { data, error } = await db.auth.signUp({
        email: $('authEmail').value.trim(),
        password: $('authPassword').value,
        options: { emailRedirectTo: location.origin + location.pathname },
      });
      if (error) return authMessage(error.message, true);
      if (!data.session) authMessage('Almost done! Check your email and click the confirmation link, then sign in here.');
    };

    $('logoutBtn').onclick = async () => {
      try { localStorage.removeItem(cacheKey()); } catch {}
      await db.auth.signOut();
    };

    // When you come back to the app (e.g. switch tabs or reopen it on your phone), grab the latest brews
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && user) fetchBrews();
    });

    // Coffee-growing countries, used for the Origin suggestions
    const COUNTRIES = [
      'Australia', 'Bolivia', 'Brazil', 'Burundi', 'Cameroon', 'China', 'Colombia', 'Costa Rica',
      "Côte d'Ivoire", 'Cuba', 'DR Congo', 'Dominican Republic', 'Ecuador', 'El Salvador', 'Ethiopia',
      'Guatemala', 'Guinea', 'Haiti', 'Honduras', 'India', 'Indonesia', 'Jamaica', 'Japan', 'Kenya',
      'Laos', 'Madagascar', 'Malawi', 'Malaysia', 'Mexico', 'Myanmar', 'Nepal', 'Nicaragua', 'Panama',
      'Papua New Guinea', 'Peru', 'Philippines', 'Puerto Rico', 'Rwanda', 'Sierra Leone', 'Sri Lanka',
      'Taiwan', 'Tanzania', 'Thailand', 'Timor-Leste', 'Togo', 'Uganda', 'United States (Hawaii)',
      'Venezuela', 'Vietnam', 'Yemen', 'Zambia', 'Zimbabwe', 'Blend'
    ];
    $('countryList').innerHTML = COUNTRIES.map(c => `<option>${c}</option>`).join('');

    // Common coffee varieties, used for the Variety suggestions
    const VARIETIES = [
      'Gesha', 'Bourbon', 'Red Bourbon', 'Yellow Bourbon', 'Pink Bourbon', 'Typica', 'Caturra', 'Catuai',
      'SL28', 'SL34', 'Ruiru 11', 'Batian', 'Pacas', 'Pacamara', 'Maragogype', 'Mundo Novo', 'Villa Sarchi',
      'Sidra', 'Wush Wush', 'Java', 'Laurina', 'Mokka', 'Castillo', 'Colombia', 'Catimor', 'Sarchimor',
      'Parainema', 'Marsellesa', 'Ethiopian Landrace', '74110', '74158', 'Kurume', 'Eugenioides'
    ];

    // Grid or list view, remembered between visits
    let view = 'grid';
    try { view = localStorage.getItem('pourover-log-view') || 'grid'; } catch {}
    const LIST_ICON = '<svg viewBox="0 0 24 24"><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/><path d="M9 6h12M9 12h12M9 18h12"/></svg>';
    const GRID_ICON = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';

    // The button shows the view you'd switch *to*
    function updateViewToggle() {
      const next = view === 'grid' ? 'list' : 'grid';
      $('viewToggle').innerHTML = next === 'list' ? LIST_ICON : GRID_ICON;
      $('viewToggle').title = `Switch to ${next} view`;
      $('viewToggle').setAttribute('aria-label', `Switch to ${next} view`);
    }
    $('viewToggle').onclick = () => {
      view = view === 'grid' ? 'list' : 'grid';
      try { localStorage.setItem('pourover-log-view', view); } catch {}
      render();
    };

    // ---------- Small helpers ----------
    const today = () => new Date().toISOString().slice(0, 10);
    // Dates are saved as 2026-10-23 (sorts correctly) but shown as 2026/10/23
    const toDisplayDate = (d) => (d || '').replaceAll('-', '/');
    const toSavedDate = (d) => (d || '').replaceAll('/', '-');
    const stars = (n) => '★'.repeat(n || 0) + '☆'.repeat(5 - (n || 0));
    const ratio = (dose, water) => (dose > 0 && water > 0) ? `1:${(water / dose).toFixed(1)}` : '—';
    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---------- Drawing the list of recipe cards ----------
    function render() {
      const q = $('q').value.trim().toLowerCase();
      const brewer = $('fBrewer').value;
      const minRating = Number($('fRating').value);

      let shown = brews.filter(b => {
        const haystack = [b.bean, b.roaster, b.origin, b.variety, b.process, b.brewer, b.grinder, b.notes].join(' ').toLowerCase();
        return (!q || haystack.includes(q))
          && (!brewer || b.brewer === brewer)
          && (b.rating || 0) >= minRating;
      });

      const sort = $('sort').value;
      shown.sort((a, b) =>
        sort === 'rating' ? (b.rating || 0) - (a.rating || 0)
        : sort === 'old' ? (a.brewDate || '').localeCompare(b.brewDate || '')
        : (b.brewDate || '').localeCompare(a.brewDate || ''));

      $('list').className = (view === 'list' && shown.length) ? 'table-wrap' : 'grid';
      updateViewToggle();

      if (!brews.length) {
        $('list').innerHTML = `<div class="empty" style="grid-column:1/-1">No brews yet. Click <b>+ New brew</b> to log your first one.</div>`;
      } else if (!shown.length) {
        $('list').innerHTML = `<div class="empty" style="grid-column:1/-1">No brews match your search.</div>`;
      } else if (view === 'list') {
        $('list').innerHTML = `
          <table>
            <thead><tr>
              <th>Date</th><th>Bean</th><th>Roaster</th><th>Origin</th><th>Variety</th><th>Process</th>
              <th>Brewer</th><th>Recipe</th><th>Temp</th><th>Time</th><th>Rating</th>
            </tr></thead>
            <tbody>
              ${shown.map(b => `
                <tr data-id="${b.id}">
                  <td>${escapeHtml(toDisplayDate(b.brewDate))}</td>
                  <td><b>${escapeHtml(b.bean)}</b></td>
                  <td>${escapeHtml(b.roaster)}</td>
                  <td>${escapeHtml(b.origin)}</td>
                  <td>${escapeHtml(b.variety)}</td>
                  <td>${escapeHtml(b.process)}</td>
                  <td>${escapeHtml(b.brewer)}</td>
                  <td>${b.dose && b.water ? `${b.dose}g : ${b.water}g (${ratio(b.dose, b.water)})` : ''}</td>
                  <td>${b.temp ? `${b.temp}°${b.tempUnit || 'C'}` : ''}</td>
                  <td>${escapeHtml(b.time)}</td>
                  <td class="stars">${stars(b.rating)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      } else {
        $('list').innerHTML = shown.map(b => `
          <div class="card" data-id="${b.id}">
            <h3>${escapeHtml(b.bean)}</h3>
            <div class="sub">${escapeHtml([b.roaster, b.origin, b.variety, b.process].filter(Boolean).join(' · '))}</div>
            <div class="chips">
              ${b.brewer ? `<span class="chip">${escapeHtml(b.brewer)}</span>` : ''}
              ${b.dose && b.water ? `<span class="chip">${b.dose}g : ${b.water}g (${ratio(b.dose, b.water)})</span>` : ''}
              ${b.temp ? `<span class="chip">${b.temp}°${b.tempUnit || 'C'}</span>` : ''}
              ${b.time ? `<span class="chip">${escapeHtml(b.time)}</span>` : ''}
            </div>
            <div class="stars">${stars(b.rating)}</div>
            <div class="sub">${escapeHtml(toDisplayDate(b.brewDate))}</div>
          </div>`).join('');
      }

      refreshDropdowns();
    }

    // Fill the brewer filter + autocomplete with values you've used before
    function refreshDropdowns() {
      const unique = (key) => [...new Set(brews.map(b => b[key]).filter(Boolean))].sort();
      const current = $('fBrewer').value;
      $('fBrewer').innerHTML = '<option value="">All</option>' +
        unique('brewer').map(v => `<option ${v === current ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
      const defaults = { brewer: ['V60', 'Kalita Wave', 'Origami', 'Chemex', 'April', 'Orea'] };
      $('brewerList').innerHTML = [...new Set([...unique('brewer'), ...defaults.brewer])].map(v => `<option>${escapeHtml(v)}</option>`).join('');
      $('grinderList').innerHTML = unique('grinder').map(v => `<option>${escapeHtml(v)}</option>`).join('');
      $('varietyList').innerHTML = [...new Set([...unique('variety'), ...VARIETIES])].map(v => `<option>${escapeHtml(v)}</option>`).join('');
    }

    // ---------- The add/edit form ----------
    const form = $('form');
    let editingId = null;
    let currentRating = 0;

    function addPourRow(p = {}) {
      const row = document.createElement('div');
      row.className = 'pour';
      row.innerHTML = `
        <input class="time-input" inputmode="numeric" placeholder="0:00" value="${escapeHtml(p.t)}">
        <input type="number" placeholder="50" value="${escapeHtml(p.g)}">
        <input placeholder="bloom, swirl…" value="${escapeHtml(p.note)}">
        <button type="button" title="Remove">✕</button>`;
      row.querySelector('button').onclick = () => row.remove();
      $('pours').appendChild(row);
    }

    function drawRating() {
      $('ratingPick').innerHTML = [1, 2, 3, 4, 5].map(n =>
        `<button type="button" data-n="${n}" class="${n <= currentRating ? 'on' : ''}">★</button>`).join('');
    }
    $('ratingPick').onclick = (e) => {
      const n = Number(e.target.dataset.n);
      if (!n) return;
      currentRating = (n === currentRating) ? 0 : n; // click same star again to clear
      drawRating();
    };

    // Time fields: type digits only and they fill in from the right, like a microwave.
    // "45" → 0:45, "130" → 1:30, "1030" → 10:30
    function formatTime(value) {
      const digits = value.replace(/\D/g, '').replace(/^0+/, '').slice(-4);
      if (!digits) return '';
      const padded = digits.padStart(3, '0');
      return `${Number(padded.slice(0, -2))}:${padded.slice(-2)}`;
    }
    // Date fields: type digits only and the slashes are added for you.
    // "20261023" → 2026/10/23
    function formatDate(value) {
      const d = value.replace(/\D/g, '').slice(0, 8);
      return [d.slice(0, 4), d.slice(4, 6), d.slice(6, 8)].filter(Boolean).join('/');
    }
    function isValidDate(value) {
      if (!value) return true; // empty is fine
      const m = value.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
      if (!m) return false;
      const date = new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00`);
      return date.getMonth() + 1 === Number(m[2]) && date.getDate() === Number(m[3]);
    }
    function checkDate(input) {
      input.setCustomValidity(isValidDate(input.value) ? '' : 'Enter a full date, like 2026/10/23');
    }

    form.addEventListener('input', (e) => {
      const el = e.target;
      if (el.classList.contains('time-input')) el.value = formatTime(el.value);
      if (el.classList.contains('date-input')) { el.value = formatDate(el.value); checkDate(el); }
    });

    // Add a calendar button next to each date field
    const CAL_ICON = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
    document.querySelectorAll('.date-field').forEach(field => {
      const text = field.querySelector('.date-input');
      const cal = document.createElement('span');
      cal.className = 'cal';
      cal.innerHTML = `<button type="button" title="Pick from calendar">${CAL_ICON}</button><input type="date" tabindex="-1">`;
      const picker = cal.querySelector('input');
      cal.querySelector('button').onclick = () => {
        picker.value = isValidDate(text.value) ? toSavedDate(text.value) : '';
        try { picker.showPicker(); } catch { picker.focus(); }
      };
      picker.onchange = () => { text.value = toDisplayDate(picker.value); checkDate(text); };
      field.appendChild(cal);
    });

    // Switching °C/°F converts the number already typed in
    $('tempUnit').onchange = () => {
      const t = Number(form.temp.value);
      if (!form.temp.value || isNaN(t)) return;
      form.temp.value = form.tempUnit.value === 'F'
        ? Math.round(t * 9 / 5 + 32)
        : Math.round((t - 32) * 5 / 9 * 2) / 2;
    };

    function updateRatio() {
      $('ratioOut').textContent = ratio(Number(form.dose.value), Number(form.water.value));
    }
    form.dose.oninput = form.water.oninput = updateRatio;

    function openForm(brew, mode) {
      form.reset();
      $('pours').innerHTML = '';
      editingId = mode === 'edit' ? brew.id : null;
      $('dlgTitle').textContent = mode === 'edit' ? 'Edit brew' : 'New brew';
      $('deleteBtn').style.display = $('dupBtn').style.display = mode === 'edit' ? '' : 'none';

      // New brews default to whichever temp unit you used last
      const lastUnit = brews.length ? brews[brews.length - 1].tempUnit : null;
      const data = brew || { brewDate: today(), tempUnit: lastUnit || 'C', pours: [{ t: '0:00', g: '', note: 'bloom' }] };
      for (const el of form.elements) {
        if (el.name && el.name in data) el.value = data[el.name] ?? '';
      }
      if (mode === 'copy') form.brewDate.value = today();
      form.querySelectorAll('.date-input').forEach(el => { el.value = toDisplayDate(el.value); checkDate(el); });
      (data.pours || []).forEach(addPourRow);
      currentRating = mode === 'copy' ? 0 : (data.rating || 0);
      drawRating();
      updateRatio();
      $('dlg').showModal();
    }

    function readForm() {
      const f = Object.fromEntries(new FormData(form));
      ['dose', 'water', 'temp'].forEach(k => f[k] = f[k] === '' ? '' : Number(f[k]));
      f.roastDate = toSavedDate(f.roastDate);
      f.brewDate = toSavedDate(f.brewDate);
      f.pours = [...$('pours').children].map(row => {
        const [t, g, note] = row.querySelectorAll('input');
        return { t: t.value, g: g.value, note: note.value };
      }).filter(p => p.t || p.g || p.note);
      f.rating = currentRating;
      return f;
    }

    form.onsubmit = () => {
      const data = readForm();
      let brew;
      if (editingId) {
        const i = brews.findIndex(b => b.id === editingId);
        brew = brews[i] = { ...brews[i], ...data };
      } else {
        brew = { id: crypto.randomUUID(), ...data };
        brews.push(brew);
      }
      cacheBrews();
      render();
      uploadBrews([brew]);
    };

    $('deleteBtn').onclick = () => {
      if (!confirm('Delete this brew?')) return;
      const id = editingId;
      brews = brews.filter(b => b.id !== id);
      cacheBrews();
      $('dlg').close();
      render();
      deleteBrewOnline(id);
    };

    $('dupBtn').onclick = () => {
      const original = brews.find(b => b.id === editingId);
      $('dlg').close();
      openForm(original, 'copy');
    };

    $('closeBtn').onclick = () => $('dlg').close();
    $('addPour').onclick = () => addPourRow();
    $('newBtn').onclick = () => openForm(null, 'new');

    // ---------- Floating + button (phones) ----------
    function setFabOpen(open) {
      $('fab').classList.toggle('open', open);
      $('fabBtn').setAttribute('aria-expanded', open);
      $('fabBtn').setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      document.querySelectorAll('.fab-item').forEach(item => item.tabIndex = open ? 0 : -1);
    }
    $('fabBtn').onclick = () => setFabOpen(!$('fab').classList.contains('open'));
    $('fabNew').onclick = () => { setFabOpen(false); openForm(null, 'new'); };
    $('fabImport').onclick = () => { setFabOpen(false); $('importFile').click(); };
    // Tapping anywhere else, or pressing Escape, closes the menu
    document.addEventListener('click', (e) => { if (!$('fab').contains(e.target)) setFabOpen(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setFabOpen(false); });
    $('list').onclick = (e) => {
      const item = e.target.closest('[data-id]');
      if (item) openForm(brews.find(b => b.id === item.dataset.id), 'edit');
    };
    ['q', 'fBrewer', 'fRating', 'sort'].forEach(id => $(id).oninput = render);

    // ---------- Backup: export / import ----------
    $('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(brews, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `pourover-log-${today()}.json`;
      a.click();
    };
    $('importBtn').onclick = () => $('importFile').click();
    $('importFile').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const incoming = JSON.parse(await file.text());
        const known = new Set(brews.map(b => b.id));
        const added = incoming.filter(b => b.id && !known.has(b.id));
        brews.push(...added);
        cacheBrews();
        render();
        if (added.length) uploadBrews(added);
        alert(`Imported ${added.length} brew(s).`);
      } catch {
        alert('That file could not be read.');
      }
      e.target.value = '';
    };
  </script>
</body>
</html>
