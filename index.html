<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pourover Log</title>

  <!-- ============================================================
       STYLES (CSS): how the page looks
       ============================================================ -->
  <style>
    :root {
      --bg: #f7f3ee;
      --card: #ffffff;
      --text: #2b2420;
      --muted: #8a7f76;
      --line: #e6ded5;
      --accent: #8b5a3c;
      --accent-soft: #f1e6dc;
      --danger: #b23b3b;
      --tabbar-h: 60px; /* height of the bottom navigation bar (plus the phone's safe area) */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --card: #262220;
        --text: #f1ebe5;
        --muted: #a39890;
        --line: #3a3430;
        --accent: #d49a6a;
        --accent-soft: #3a2e26;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 960px; margin: 0 auto;
      padding: 24px max(16px, env(safe-area-inset-right)) calc(var(--tabbar-h) + 48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.6rem; }
    h1 span { color: var(--accent); }

    button {
      font: inherit; cursor: pointer; border-radius: 8px;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      padding: 8px 14px;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--danger); }
    button.small { padding: 4px 10px; font-size: .85rem; }

    input, select, textarea {
      font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    textarea { resize: vertical; min-height: 60px; }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }

    /* Search & filter bar: folded away behind the filter button, slides open below the header */
    .filter-panel {
      display: grid; grid-template-rows: 0fr; opacity: 0;
      transition: grid-template-rows .3s cubic-bezier(.4, 0, .2, 1), opacity .2s ease;
    }
    .filter-panel.open { grid-template-rows: 1fr; opacity: 1; }
    /* Extra 3px around the inside so focus outlines aren't cut off */
    .filter-inner { min-height: 0; overflow: hidden; padding: 3px; margin: -3px; }
    .filters {
      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; padding-top: 20px;
      transform: translateY(-8px); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }
    .filter-panel.open .filters { transform: none; }
    @media (max-width: 640px) { .filters { grid-template-columns: 1fr 1fr; } .filters .search { grid-column: 1 / -1; } }
    #list { margin-top: 20px; }

    /* Recipe cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px; cursor: pointer; transition: border-color .15s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { margin: 0 0 2px; font-size: 1.05rem; }
    .card .sub { color: var(--muted); font-size: .85rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
    .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: .8rem; }
    .score { color: var(--accent); font-weight: 600; }
    .score small { color: var(--muted); font-weight: 400; }
    .taste-line { color: var(--muted); font-size: .8rem; margin-top: 2px; }
    .empty { text-align: center; color: var(--muted); padding: 60px 0; }
    /* A card with a photo: details on the left, square photo on the right */
    .card.has-photo { display: flex; gap: 12px; }
    .card-main { flex: 1; min-width: 0; }
    .card-photo { flex: none; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; background: var(--accent-soft); }
    .card-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Grid / List switch: a single icon button showing the *other* view */
    .icon-btn { position: relative; display: flex; align-items: center; justify-content: center; padding: 8px 10px; }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    /* An icon button whose panel or menu is open */
    .icon-btn[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    /* Small dot on an icon button: filters are in use */
    .icon-btn.has-badge::after {
      content: ''; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 2px var(--card);
    }

    /* Account page: a card split into sections; new account features can be added as more sections */
    .panel { max-width: 480px; margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    .panel-section { padding: 14px 16px; }
    .panel-section + .panel-section { border-top: 1px solid var(--line); }
    .panel-section.actions { padding: 6px; }
    .panel-label { font-size: .75rem; color: var(--muted); }
    .panel-email { font-weight: 600; overflow-wrap: anywhere; }
    .panel-status { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: .85rem; color: var(--muted); }
    .panel-status::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .panel-status:has(.err) { color: var(--danger); }
    .panel-item {
      display: block; width: 100%; text-align: left; border: none; background: none; border-radius: 8px; padding: 10px;
    }
    .panel-item:hover, .panel-item:focus-visible { background: var(--accent-soft); }

    /* Coffee Setup page: one box per category (Brewer, Grinder…), side by side on wide screens */
    .gear-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .gear-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .gear-head h2 { margin: 0; font-size: 1.05rem; }
    .gear-groups .panel { max-width: none; margin-top: 8px; padding: 6px; }
    .gear-name { display: block; font-weight: 600; overflow-wrap: anywhere; }
    .gear-sub { color: var(--muted); font-size: .8rem; }
    .panel-item .gear-sub { display: block; }
    .gear-empty { padding: 10px; color: var(--muted); font-size: .9rem; }

    /* Equipment popup: product suggestions under the search box */
    #gearDlg { width: min(480px, calc(100% - 32px)); }
    .gear-search { margin-bottom: 16px; }
    .gear-results { margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .gear-result {
      display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
      width: 100%; text-align: left; border: none; border-radius: 0; background: none; padding: 8px 10px;
    }
    .gear-result + .gear-result { border-top: 1px solid var(--line); }
    .gear-result:hover, .gear-result:focus-visible { background: var(--accent-soft); }
    .hint { margin: 6px 0 0; color: var(--muted); font-size: .8rem; }

    /* "Others" tick boxes in the brew form */
    .checks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
    .check { display: flex; align-items: center; gap: 6px; margin: 0; font-size: .95rem; color: var(--text); }
    .check input { width: auto; }

    /* Bottom navigation bar: always visible, sits above the phone's home-swipe area */
    .tabbar {
      position: fixed; z-index: 15; left: 0; right: 0; bottom: 0;
      background: var(--card); border-top: 1px solid var(--line);
      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .tabbar-inner { display: flex; max-width: 480px; margin: 0 auto; }
    .tab {
      flex: 1; height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: var(--muted); text-decoration: none; font-size: .72rem; -webkit-tap-highlight-color: transparent;
    }
    .tab:hover { color: var(--text); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 10px; }
    .tab-icon { position: relative; display: flex; padding: 3px 18px; border-radius: 999px; transition: background-color .15s; }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    /* The page you're on: accent colour with a soft pill behind its icon */
    .tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
    .tab[aria-current="page"] .tab-icon { background: var(--accent-soft); }
    /* Red dot on the Account tab when syncing failed */
    .tab.has-badge .tab-icon::after {
      content: ''; position: absolute; top: 2px; right: 14px; width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger); box-shadow: 0 0 0 2px var(--card);
    }

    /* Floating "+" button (phones only) with a menu that slides up out of it */
    .fab {
      display: none; position: fixed; z-index: 10;
      right: calc(20px + env(safe-area-inset-right));
      bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom));
    }
    .fab-btn {
      position: relative; z-index: 1; width: 56px; height: 56px; padding: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff; border: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s;
    }
    .fab-btn:active { transform: scale(.94); }
    .fab-btn svg {
      width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round;
      transition: transform .25s cubic-bezier(.2, .8, .2, 1);
    }
    .fab.open .fab-btn svg { transform: rotate(45deg); }
    .fab-item {
      position: absolute; right: 0; bottom: 7px; white-space: nowrap;
      border-radius: 999px; padding: 10px 18px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
      /* Closed: tucked behind the + button, small and invisible */
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(0) scale(.6); transform-origin: right center;
      transition: transform .22s cubic-bezier(.4, 0, .2, 1), opacity .18s ease, visibility 0s linear .22s;
    }
    .fab.open .fab-item {
      /* Open: each item (--i = 1, 2…) slides up to its own spot above the + button */
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: translateY(calc(var(--i) * -54px - 10px)) scale(1);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1) calc((var(--i) - 1) * 40ms),
                  opacity .2s ease calc((var(--i) - 1) * 40ms), visibility 0s;
    }
    @media (max-width: 640px) {
      .fab { display: block; }
      #newBtn, #importBtn { display: none; } /* the floating button covers these on phones */
      #page-log { padding-bottom: calc(var(--tabbar-h) + 100px + env(safe-area-inset-bottom)); } /* last card stays clear of it */
    }
    @media (prefers-reduced-motion: reduce) {
      .fab-item, .fab-btn svg, .filter-panel, .filters { transition-duration: .01s !important; transition-delay: 0s !important; }
    }

    /* List view (table) — scrolls sideways on its own on small screens */
    .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: .8rem; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--accent-soft); }
    tbody tr:last-child td { border-bottom: none; }

    /* Form popup (dialog) */
    dialog {
      border: none; border-radius: 14px; padding: 0; width: min(720px, calc(100% - 32px));
      background: var(--card); color: var(--text);
    }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .dlg-head h2 { margin: 0; font-size: 1.2rem; }
    .dlg-body { padding: 16px 20px; max-height: 70vh; overflow-y: auto; }
    .dlg-foot { display: flex; justify-content: space-between; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
    fieldset { border: none; padding: 0; margin: 0 0 20px; }
    legend { font-weight: 600; margin-bottom: 10px; color: var(--accent); }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .ratio { font-size: .9rem; color: var(--muted); }
    .inline { display: flex; gap: 6px; }
    .inline select { width: auto; }
    .cal { position: relative; flex: none; }
    .cal button { height: 100%; padding: 0 10px; display: flex; align-items: center; }
    .cal button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    /* Invisible native date input, only used to show the calendar popup */
    .cal input[type="date"] { position: absolute; inset: 0; opacity: 0; pointer-events: none; padding: 0; }
    .date-input:invalid { border-color: var(--danger); }

    /* Pour schedule rows */
    .pour { display: grid; grid-template-columns: 80px 90px 1fr 32px; gap: 8px; margin-bottom: 6px; align-items: center; }
    .pour button { padding: 6px; }

    /* Tasting scores: a line with 10 marks; drag the dot along it (or tap a spot) to pick 1–10 */
    .scale-row { display: grid; grid-template-columns: 90px 1fr 2em; gap: 10px; align-items: center; margin-bottom: 4px; }
    .scale-row.overall { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .scale-row .name { font-size: .9rem; }
    .scale-row.overall .name { font-weight: 600; }
    /* pan-y: a sideways drag picks a score, an up/down swipe still scrolls the form */
    .scale { height: 34px; padding: 0 10px; cursor: pointer; touch-action: pan-y; user-select: none; outline: none; }
    .scale .rail { position: relative; height: 100%; }
    .scale .line, .scale .fill { position: absolute; left: 0; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--line); }
    .scale .line { right: 0; }
    .scale .fill { width: var(--at); background: var(--accent); }
    .scale .marks { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; }
    .scale .marks i { width: 4px; height: 4px; margin: 0 -2px; border-radius: 50%; background: var(--line); }
    .scale .marks i.on { background: var(--accent); }
    .scale .dot {
      position: absolute; top: 50%; left: var(--at); width: 18px; height: 18px; margin: -9px 0 0 -9px;
      border-radius: 50%; background: var(--accent); border: 2px solid var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    }
    .scale:focus-visible .dot { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Not scored yet: just the plain line */
    .scale.unset .dot, .scale.unset .fill { display: none; }
    .scale-row .value { text-align: right; font-weight: 600; color: var(--accent); }

    /* Photo picker in the form */
    .photo-add {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px;
      border: 1.5px dashed var(--line); background: var(--bg); color: var(--muted);
    }
    .photo-add svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .photo-add:hover, .photo-field.dragging .photo-add { border-color: var(--accent); color: var(--accent); }
    .photo-preview { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    .photo-preview img { display: block; width: 160px; height: 160px; object-fit: cover; border-radius: 10px; background: var(--accent-soft); }
    .photo-field.dragging .photo-preview img { outline: 2px solid var(--accent); }
    .photo-preview .toolbar { gap: 6px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    [hidden] { display: none !important; }

    /* Sign-in screen */
    .auth-wrap { padding: 0 16px; }
    .auth {
      max-width: 380px; margin: 12vh auto 0; padding: 24px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    }
    .auth h1 { margin-bottom: 4px; }
    .auth p { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
    .auth .field { margin-bottom: 12px; }
    .auth .actions { display: flex; gap: 8px; margin-top: 16px; }
    .auth .actions button { flex: 1; }
    .auth .msg { margin-top: 14px; font-size: .9rem; }
    .msg.err { color: var(--danger); }
  </style>
</head>
<body>
  <!-- ============================================================
       PAGE STRUCTURE (HTML): what's on the page
       ============================================================ -->
  <!-- Sign-in screen, shown when you're logged out -->
  <div class="auth-wrap" id="authView" hidden>
    <form class="auth" id="authForm">
      <h1>Pourover <span>Log</span></h1>
      <p>Sign in to see your brews on any device.</p>
      <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></div>
      <div class="actions">
        <button type="submit" class="primary" id="signInBtn">Sign in</button>
        <button type="button" id="signUpBtn">Create account</button>
      </div>
      <div class="msg" id="authMsg"></div>
    </form>
  </div>

  <div id="appView" hidden>
  <!-- Page 1: Brew Log (the list of brews) -->
  <section class="wrap" id="page-log">
    <header>
      <h1>Pourover <span>Log</span></h1>
      <div class="toolbar">
        <button type="button" class="icon-btn" id="viewToggle"></button>
        <button type="button" class="icon-btn" id="filterBtn" title="Search & filter" aria-label="Search & filter" aria-expanded="false" aria-controls="filterPanel">
          <svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        </button>
        <button id="exportBtn" class="icon-btn" title="Export a backup file" aria-label="Export a backup file">
          <svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2"/></svg>
        </button>
        <button id="importBtn" title="Load a backup file">Import</button>
        <input type="file" id="importFile" accept=".json" hidden>
        <button class="primary" id="newBtn">+ New brew</button>
      </div>
    </header>

    <!-- Search & filter options, folded away until the filter button is pressed -->
    <div class="filter-panel" id="filterPanel" inert><div class="filter-inner">
    <div class="filters">
      <div class="search">
        <label for="q">Search</label>
        <input id="q" placeholder="Bean, roaster, origin, notes…">
      </div>
      <div>
        <label for="fBrewer">Brewer</label>
        <select id="fBrewer"><option value="">All</option></select>
      </div>
      <div>
        <label for="fRating">Min overall</label>
        <select id="fRating">
          <option value="0">Any</option>
          <option value="6">6+</option>
          <option value="8">8+</option>
          <option value="10">10</option>
        </select>
      </div>
      <div>
        <label for="sort">Sort</label>
        <select id="sort">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="rating">Overall score</option>
        </select>
      </div>
    </div>
    </div></div>

    <div id="list" class="grid"></div>

    <!-- Floating + button for phones; its menu slides up out of it -->
    <div class="fab" id="fab">
      <button type="button" class="fab-item" id="fabImport" style="--i: 2" tabindex="-1">Import</button>
      <button type="button" class="fab-item primary" id="fabNew" style="--i: 1" tabindex="-1">New brew</button>
      <button type="button" class="fab-btn" id="fabBtn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </section>

  <!-- Page 2: Coffee Setup. Your equipment, one box per category; filled in by renderSetup() -->
  <section class="wrap" id="page-setup" hidden>
    <header><h1>Coffee Setup</h1></header>
    <div class="gear-groups" id="gearGroups"></div>
  </section>

  <!-- Page 3: Account. To add a feature, add another .panel-section, or a .panel-item button to the actions list -->
  <section class="wrap" id="page-account" hidden>
    <header><h1>Account</h1></header>
    <div class="panel">
      <div class="panel-section">
        <div class="panel-label">Signed in as</div>
        <div class="panel-email" id="userEmail"></div>
        <div class="panel-status"><span id="syncStatus"></span></div>
      </div>
      <div class="panel-section actions">
        <button type="button" class="panel-item danger" id="logoutBtn">Log out</button>
      </div>
    </div>
  </section>

  <!-- Bottom navigation bar: each tab links to one of the pages above -->
  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      <a class="tab" id="tab-log" href="#log">
        <span class="tab-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>
        Brew Log
      </a>
      <a class="tab" id="tab-setup" href="#setup">
        <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16l-5 8H9z"/><path d="M10 14v2h4v-2M6 20h12"/></svg></span>
        Coffee Setup
      </a>
      <a class="tab" id="tab-account" href="#account">
        <span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
        Account
      </a>
    </div>
  </nav>
  </div>

  <!-- ============================================================
       BEHAVIOR (JavaScript): what happens when you click things
       ============================================================ -->
  <!-- Supabase library: talks to the online database and handles logins -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // ---------- Connection to the online database (Supabase) ----------
    // These two values are safe to be public: the database only lets each
    // signed-in user read and change their own brews (see supabase/setup.sql).
    const SUPABASE_URL = 'https://ixiyhlvcobbdbevhxgok.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5QIBbcSz1AZT5Sjk5YUH3w_adVdt-ix';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Where brews were kept before syncing existed (only used for the one-time upload)
    const OLD_STORAGE_KEY = 'pourover-log-v1';

    let user = null;
    let brews = [];
    let gear = []; // your equipment from Coffee Setup

    // A copy of your brews and equipment is also kept in this browser, so the app opens instantly
    const cacheKey = () => `pourover-log-cache-${user.id}`;
    const gearCacheKey = () => `pourover-log-gear-${user.id}`;
    function loadCache(key) {
      try { return JSON.parse(localStorage.getItem(key)) || []; }
      catch { return []; }
    }
    function cacheBrews() {
      try { localStorage.setItem(cacheKey(), JSON.stringify(brews)); } catch {}
    }
    function cacheGear() {
      try { localStorage.setItem(gearCacheKey(), JSON.stringify(gear)); } catch {}
    }

    function setStatus(text, isError = false) {
      $('syncStatus').textContent = text;
      $('syncStatus').className = isError ? 'err' : '';
      // The status lives on the Account page, so flag problems on its tab too
      $('tab-account').classList.toggle('has-badge', isError);
    }

    // ---------- Reading & writing brews and equipment online ----------
    // Both tables keep each item's details in a `data` column, next to its id
    async function fetchAll() {
      setStatus('Syncing…');
      const [b, g] = await Promise.all([
        db.from('brews').select('id, data'),
        db.from('equipment').select('id, data'),
      ]);
      if (b.error) return setStatus('Offline: showing the last synced copy', true);
      brews = b.data.map(row => ({ ...row.data, id: row.id }));
      cacheBrews();
      if (!g.error) {
        gear = g.data.map(row => ({ ...row.data, id: row.id }));
        moveKettlesToOthers();
        cacheGear();
      }
      render();
      setStatus(g.error ? 'Coffee Setup not synced: check your connection' : 'Synced', !!g.error);
    }

    async function uploadRows(table, list) {
      setStatus('Saving…');
      const rows = list.map(({ id, ...data }) => ({ id, data, updated_at: new Date().toISOString() }));
      const { error } = await db.from(table).upsert(rows);
      if (error) {
        setStatus('Not saved: check your connection', true);
        return false;
      }
      setStatus('Synced');
      return true;
    }
    // Kettles used to be their own category; now they're Others with the type "Kettle".
    // Moves any saved the old way (gear and brews), and saves the moved ones.
    function moveKettlesToOthers() {
      const oldGear = gear.filter(g => g.category === 'kettle');
      oldGear.forEach(g => { g.category = 'other'; g.type = 'Kettle'; });
      const oldBrews = brews.filter(b => b.kettle || b.kettleId);
      oldBrews.forEach(b => {
        if (b.kettleId) b.others = [...(b.others || []), { id: b.kettleId, name: b.kettle || '', type: 'Kettle' }];
        delete b.kettle;
        delete b.kettleId;
      });
      if (oldBrews.length) { cacheBrews(); uploadBrews(oldBrews); }
      if (oldGear.length) uploadGear(oldGear);
    }

    function uploadBrews(list) { return uploadRows('brews', list); }
    function uploadGear(list) { return uploadRows('equipment', list); }

    async function deleteGearOnline(id) {
      setStatus('Saving…');
      const { error } = await db.from('equipment').delete().eq('id', id);
      setStatus(error ? 'Delete failed: check your connection' : 'Synced', !!error);
    }

    async function deleteBrewOnline(id, photo) {
      setStatus('Saving…');
      const { error } = await db.from('brews').delete().eq('id', id);
      setStatus(error ? 'Delete failed: check your connection' : 'Synced', !!error);
      if (!error) deletePhotoOnline(photo);
    }

    // Saves a new or edited brew. If it has a new photo, that is uploaded first.
    // oldPhoto is the photo the brew had before; it's deleted once it's no longer used.
    async function saveBrew(brew, photoBlob, oldPhoto) {
      const photo = brew.photo;
      let photoSaved = true;
      if (photoBlob) {
        setStatus('Saving photo…');
        photoSaved = await uploadPhoto(photo, photoBlob);
      }
      // Use the latest copy, in case the brew was changed or deleted while the photo uploaded
      const latest = brews.find(b => b.id === brew.id);
      if (!latest) return;
      if (!photoSaved && latest.photo === photo) {
        latest.photo = oldPhoto; // keep the brew, just without the new photo
        cacheBrews();
        render();
      }
      if (!await uploadBrews([latest])) return;
      if (!photoSaved) return setStatus('Photo not saved: check your connection', true);
      if (oldPhoto && oldPhoto !== latest.photo) deletePhotoOnline(oldPhoto);
    }

    // ---------- Photos ----------
    // Photos are stored as files in Supabase Storage (not in the brew itself, which would make it
    // too big to keep in this browser). A brew's `photo` is the file's name, like "<user id>/<random id>.jpg".
    // The storage is private, so each photo is shown through a temporary link from Supabase.
    const PHOTO_BUCKET = 'brew-photos';
    const photoUrls = new Map(); // file name → link (null while asking for it, '' if the photo is missing)
    let photoUrlsSince = Date.now();

    async function uploadPhoto(path, blob) {
      const { error } = await db.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
      return !error;
    }

    async function deletePhotoOnline(path) {
      // If this fails, the only harm is an unused file left in storage
      if (path) await db.storage.from(PHOTO_BUCKET).remove([path]);
    }

    // Ask Supabase for links to any photos we can't show yet, then redraw
    async function loadPhotoUrls() {
      // Links last a week; get fresh ones every day so an open tab never ends up with expired ones
      if (Date.now() - photoUrlsSince > 24 * 60 * 60 * 1000) { photoUrls.clear(); photoUrlsSince = Date.now(); }
      const missing = [...new Set(brews.map(b => b.photo).filter(p => p && !photoUrls.has(p)))];
      if (!missing.length) return;
      missing.forEach(p => photoUrls.set(p, null));
      const { data, error } = await db.storage.from(PHOTO_BUCKET).createSignedUrls(missing, 7 * 24 * 60 * 60);
      if (error) { missing.forEach(p => photoUrls.delete(p)); return; } // offline: try again next time
      data.forEach(d => photoUrls.set(d.path, d.signedUrl || ''));
      render();
      drawFormPhoto();
    }

    // Phone photos are huge, so shrink them to at most 1200px on the long side and save as JPEG.
    // (On iPhone, HEIC photos are converted to JPEG automatically when picked.)
    async function shrinkPhoto(file) {
      const MAX = 1200;
      const src = URL.createObjectURL(file);
      try {
        const img = new Image();
        img.src = src;
        await img.decode();
        const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; // see-through parts of PNGs become white instead of black
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        return await new Promise((resolve, reject) =>
          canvas.toBlob(b => b ? resolve(b) : reject(new Error('Could not convert photo')), 'image/jpeg', 0.82));
      } finally {
        URL.revokeObjectURL(src);
      }
    }

    // First sign-in on a browser that already has brews saved: offer to upload them
    async function offerLocalUpload() {
      let local = [];
      try { local = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY)) || []; } catch {}
      if (!local.length) return;
      if (!confirm(`Found ${local.length} brew(s) saved in this browser. Upload them to your account?`)) return;
      if (await uploadBrews(local)) {
        // Keep a backup copy under a new name instead of deleting it outright
        try {
          localStorage.setItem(OLD_STORAGE_KEY + '-uploaded', JSON.stringify(local));
          localStorage.removeItem(OLD_STORAGE_KEY);
        } catch {}
      }
    }

    // ---------- Signing in & out ----------
    async function showSignedIn() {
      $('authView').hidden = true;
      $('appView').hidden = false;
      $('userEmail').textContent = user.email;
      showPage();
      brews = loadCache(cacheKey());
      gear = loadCache(gearCacheKey());
      render();
      await offerLocalUpload();
      await fetchAll();
    }

    function showSignedOut() {
      $('appView').hidden = true;
      $('authView').hidden = false;
      brews = [];
      gear = [];
      photoUrls.clear();
      // Start the next sign-in on the Brew Log page
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    }

    db.auth.onAuthStateChange((event, session) => {
      const newUser = session?.user || null;
      // A token refresh for the same person: nothing to do (but always draw the first screen)
      if (event !== 'INITIAL_SESSION' && newUser?.id === user?.id) return;
      user = newUser;
      // setTimeout lets Supabase finish its own work before we query the database
      setTimeout(() => user ? showSignedIn() : showSignedOut(), 0);
    });

    function authMessage(text, isError = false) {
      $('authMsg').textContent = text;
      $('authMsg').className = 'msg' + (isError ? ' err' : '');
    }

    $('authForm').onsubmit = async (e) => {
      e.preventDefault();
      authMessage('Signing in…');
      const { error } = await db.auth.signInWithPassword({
        email: $('authEmail').value.trim(),
        password: $('authPassword').value,
      });
      authMessage(error ? error.message : '', !!error);
    };

    $('signUpBtn').onclick = async () => {
      if (!$('authForm').reportValidity()) return;
      authMessage('Creating account…');
      const { data, error } = await db.auth.signUp({
        email: $('authEmail').value.trim(),
        password: $('authPassword').value,
        options: { emailRedirectTo: location.origin + location.pathname },
      });
      if (error) return authMessage(error.message, true);
      if (!data.session) authMessage('Almost done! Check your email and click the confirmation link, then sign in here.');
    };

    $('logoutBtn').onclick = async () => {
      try {
        localStorage.removeItem(cacheKey());
        localStorage.removeItem(gearCacheKey());
      } catch {}
      await db.auth.signOut();
    };

    // When you come back to the app (e.g. switch tabs or reopen it on your phone), grab the latest brews
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && user) fetchAll();
    });

    // Coffee-growing countries, used for the Origin suggestions
    const COUNTRIES = [
      'Australia', 'Bolivia', 'Brazil', 'Burundi', 'Cameroon', 'China', 'Colombia', 'Costa Rica',
      "Côte d'Ivoire", 'Cuba', 'DR Congo', 'Dominican Republic', 'Ecuador', 'El Salvador', 'Ethiopia',
      'Guatemala', 'Guinea', 'Haiti', 'Honduras', 'India', 'Indonesia', 'Jamaica', 'Japan', 'Kenya',
      'Laos', 'Madagascar', 'Malawi', 'Malaysia', 'Mexico', 'Myanmar', 'Nepal', 'Nicaragua', 'Panama',
      'Papua New Guinea', 'Peru', 'Philippines', 'Puerto Rico', 'Rwanda', 'Sierra Leone', 'Sri Lanka',
      'Taiwan', 'Tanzania', 'Thailand', 'Timor-Leste', 'Togo', 'Uganda', 'United States (Hawaii)',
      'Venezuela', 'Vietnam', 'Yemen', 'Zambia', 'Zimbabwe', 'Blend'
    ];
    $('countryList').innerHTML = COUNTRIES.map(c => `<option>${c}</option>`).join('');

    // Common coffee varieties, used for the Variety suggestions
    const VARIETIES = [
      'Gesha', 'Bourbon', 'Red Bourbon', 'Yellow Bourbon', 'Pink Bourbon', 'Typica', 'Caturra', 'Catuai',
      'SL28', 'SL34', 'Ruiru 11', 'Batian', 'Pacas', 'Pacamara', 'Maragogype', 'Mundo Novo', 'Villa Sarchi',
      'Sidra', 'Wush Wush', 'Java', 'Laurina', 'Mokka', 'Castillo', 'Colombia', 'Catimor', 'Sarchimor',
      'Parainema', 'Marsellesa', 'Ethiopian Landrace', '74110', '74158', 'Kurume', 'Eugenioides'
    ];

    // Grid or list view, remembered between visits
    let view = 'grid';
    try { view = localStorage.getItem('pourover-log-view') || 'grid'; } catch {}
    const LIST_ICON = '<svg viewBox="0 0 24 24"><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/><path d="M9 6h12M9 12h12M9 18h12"/></svg>';
    const GRID_ICON = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';

    // The button shows the view you'd switch *to*
    function updateViewToggle() {
      const next = view === 'grid' ? 'list' : 'grid';
      $('viewToggle').innerHTML = next === 'list' ? LIST_ICON : GRID_ICON;
      $('viewToggle').title = `Switch to ${next} view`;
      $('viewToggle').setAttribute('aria-label', `Switch to ${next} view`);
    }
    $('viewToggle').onclick = () => {
      view = view === 'grid' ? 'list' : 'grid';
      try { localStorage.setItem('pourover-log-view', view); } catch {}
      render();
    };

    // ---------- Small helpers ----------
    const today = () => new Date().toISOString().slice(0, 10);
    // Dates are saved as 2026-10-23 (sorts correctly) but shown as 2026/10/23
    const toDisplayDate = (d) => (d || '').replaceAll('-', '/');
    const toSavedDate = (d) => (d || '').replaceAll('/', '-');
    // Tasting scores, each 1–10 (0 = not scored yet)
    const TASTES = [['body', 'Body'], ['acidity', 'Acidity'], ['sweetness', 'Sweetness'], ['bitterness', 'Bitterness'], ['clarity', 'Clarity']];
    // Older brews had a 1–5 star "rating" instead of "overall", so double it
    const overallOf = (b) => 'overall' in b ? b.overall || 0 : (b.rating || 0) * 2;
    const scoreHtml = (n) => n ? `<span class="score">${n}<small>/10</small></span>` : '';
    const tasteLine = (b) => TASTES.filter(([key]) => b[key]).map(([key, label]) => `${label} ${b[key]}`).join(' · ');
    const ratio = (dose, water) => (dose > 0 && water > 0) ? `1:${(water / dose).toFixed(1)}` : '—';
    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---------- Drawing the list of recipe cards ----------
    function render() {
      const q = $('q').value.trim().toLowerCase();
      const brewer = $('fBrewer').value;
      const minRating = Number($('fRating').value);
      // A dot on the filter button reminds you some brews are hidden, even when the panel is closed
      $('filterBtn').classList.toggle('has-badge', !!(q || brewer || minRating));

      let shown = brews.filter(b => {
        const haystack = [b.bean, b.roaster, b.origin, b.variety, b.process, b.brewer, b.grinder, b.filter,
          ...(b.others || []).map(o => o.name), b.notes].join(' ').toLowerCase();
        return (!q || haystack.includes(q))
          && (!brewer || b.brewer === brewer)
          && overallOf(b) >= minRating;
      });

      const sort = $('sort').value;
      shown.sort((a, b) =>
        sort === 'rating' ? overallOf(b) - overallOf(a)
        : sort === 'old' ? (a.brewDate || '').localeCompare(b.brewDate || '')
        : (b.brewDate || '').localeCompare(a.brewDate || ''));

      $('list').className = (view === 'list' && shown.length) ? 'table-wrap' : 'grid';
      updateViewToggle();

      if (!brews.length) {
        $('list').innerHTML = `<div class="empty" style="grid-column:1/-1">No brews yet. Click <b>+ New brew</b> to log your first one.</div>`;
      } else if (!shown.length) {
        $('list').innerHTML = `<div class="empty" style="grid-column:1/-1">No brews match your search.</div>`;
      } else if (view === 'list') {
        $('list').innerHTML = `
          <table>
            <thead><tr>
              <th>Date</th><th>Bean</th><th>Roaster</th><th>Origin</th><th>Variety</th><th>Process</th>
              <th>Brewer</th><th>Recipe</th><th>Temp</th><th>Time</th><th>Overall</th>
            </tr></thead>
            <tbody>
              ${shown.map(b => `
                <tr data-id="${b.id}">
                  <td>${escapeHtml(toDisplayDate(b.brewDate))}</td>
                  <td><b>${escapeHtml(b.bean)}</b></td>
                  <td>${escapeHtml(b.roaster)}</td>

          const photo = photoUrl === '' ? ''
            : `<div class="card-photo">${photoUrl ? `<img src="${escapeHtml(photoUrl)}" alt="" loading="lazy">` : ''}</div>`;

          <div class="card${photo ? ' has-photo' : ''}" data-id="${b.id}">

              ${b.temp ? `<span class="chip">${b.temp}°${b.tempUnit || 'C'}</span>` : ''}

    // Fill the brewer filter + variety autocomplete with values you've used before
    function refreshDropdowns() {
      const unique = (key) => [...new Set(brews.map(b => b[key]).filter(Boolean))].sort();
      const current = $('fBrewer').value;
      $('fBrewer').innerHTML = '<option value="">All</option>' +
        unique('brewer').map(v => `<option ${v === current ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
      $('varietyList').innerHTML = [...new Set([...unique('variety'), ...VARIETIES])].map(v => `<option>${escapeHtml(v)}</option>`).join('');
    }

    // ---------- The add/edit form ----------
    const form = $('form');
    let editingId = null;
    let formOrig = {}; // the brew as it was when the form opened (to keep its equipment names)
    let scores = {}; // tasting scores picked in the form, e.g. { overall: 8, body: 6 }

    function addPourRow(p = {}) {
      const row = document.createElement('div');
      row.className = 'pour';
      row.innerHTML = `
        <input class="time-input" inputmode="numeric" placeholder="0:00" value="${escapeHtml(p.t)}">
        <input type="number" placeholder="50" value="${escapeHtml(p.g)}">
        <input placeholder="bloom, swirl…" value="${escapeHtml(p.note)}">
        <button type="button" title="Remove">✕</button>`;

      $('pours').appendChild(row);
    }

    // Tasting score lines: drag the dot with a finger or the mouse, or tap a spot on the line.
    // Tapping the current score again clears it. Arrow keys work too.
    $('scales').innerHTML = [['overall', 'Overall'], ...TASTES].map(([key, label]) => `
      <div class="scale-row${key === 'overall' ? ' overall' : ''}">
        <span class="name">${label}</span>
        <div class="scale" data-key="${key}" role="slider" tabindex="0" aria-label="${label}" aria-valuemin="0" aria-valuemax="10">
          <div class="rail"><span class="line"></span><span class="fill"></span>
            <span class="marks">${'<i></i>'.repeat(10)}</span><span class="dot"></span></div>
        </div>
        <span class="value"></span>
      </div>`).join('');

    function drawScales() {
      $('scales').querySelectorAll('.scale').forEach(bar => {
        const n = scores[bar.dataset.key] || 0;
        // Score 1 sits at the left end of the line, 10 at the right end
        bar.style.setProperty('--at', `${(Math.max(n, 1) - 1) / 9 * 100}%`);
        bar.classList.toggle('unset', !n);
        bar.querySelectorAll('.marks i').forEach((mark, i) => mark.classList.toggle('on', i < n));
        bar.setAttribute('aria-valuenow', n);
        bar.nextElementSibling.textContent = n || '–';
      });
    }

    $('scales').querySelectorAll('.scale').forEach(bar => {
      const key = bar.dataset.key;
      let before = 0, moved = false;
      // Which mark (1–10) is closest to the finger or mouse
      const scoreAt = (x) => {
        const box = bar.querySelector('.rail').getBoundingClientRect();
        return Math.min(10, Math.max(1, Math.round((x - box.left) / box.width * 9) + 1));
      };
      const set = (n) => { scores[key] = n; drawScales(); };
      bar.onpointerdown = (e) => {
        bar.setPointerCapture(e.pointerId);
        before = scores[key] || 0;
        moved = false;
        set(scoreAt(e.clientX));
      };
      bar.onpointermove = (e) => {
        if (!bar.hasPointerCapture(e.pointerId)) return;
        const n = scoreAt(e.clientX);
        if (n !== scores[key]) { moved = true; set(n); }
      };
      bar.onpointerup = () => { if (!moved && scores[key] === before) set(0); };
      // The browser took over to scroll the form: put the score back
      bar.onpointercancel = () => set(before);
      bar.onkeydown = (e) => {
        const n = scores[key] || 0;
        const next = { ArrowRight: n + 1, ArrowUp: n + 1, ArrowLeft: n - 1, ArrowDown: n - 1, Delete: 0, Backspace: 0 }[e.key];
        if (next === undefined) return;
        e.preventDefault();
        set(Math.min(10, Math.max(0, next)));
      };
    });

    // Time fields: type digits only and they fill in from the right, like a microwave.
    // "45" → 0:45, "130" → 1:30, "1030" → 10:30
    function formatTime(value) {
      const digits = value.replace(/\D/g, '').replace(/^0+/, '').slice(-4);
      if (!digits) return '';
      const padded = digits.padStart(3, '0');
      return `${Number(padded.slice(0, -2))}:${padded.slice(-2)}`;
    }
    // Date fields: type digits only and the slashes are added for you.
    // "20261023" → 2026/10/23
    function formatDate(value) {
      const d = value.replace(/\D/g, '').slice(0, 8);
      return [d.slice(0, 4), d.slice(4, 6), d.slice(6, 8)].filter(Boolean).join('/');
    }
    function isValidDate(value) {
      if (!value) return true; // empty is fine
      const m = value.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
      if (!m) return false;
      const date = new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00`);
      return date.getMonth() + 1 === Number(m[2]) && date.getDate() === Number(m[3]);
    }
    function checkDate(input) {
      input.setCustomValidity(isValidDate(input.value) ? '' : 'Enter a full date, like 2026/10/23');
    }

    form.addEventListener('input', (e) => {
      const el = e.target;
      if (el.classList.contains('time-input')) el.value = formatTime(el.value);
      if (el.classList.contains('date-input')) { el.value = formatDate(el.value); checkDate(el); }
    });

    // Add a calendar button next to each date field
    const CAL_ICON = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
    document.querySelectorAll('.date-field').forEach(field => {
      const text = field.querySelector('.date-input');
      const cal = document.createElement('span');
      cal.className = 'cal';
      cal.innerHTML = `<button type="button" title="Pick from calendar">${CAL_ICON}</button><input type="date" tabindex="-1">`;
      const picker = cal.querySelector('input');
      cal.querySelector('button').onclick = () => {
        picker.value = isValidDate(text.value) ? toSavedDate(text.value) : '';
        try { picker.showPicker(); } catch { picker.focus(); }
      };
      picker.onchange = () => { text.value = toDisplayDate(picker.value); checkDate(text); };
      field.appendChild(cal);
    });

    // Switching °C/°F converts the number already typed in
    $('tempUnit').onchange = () => {
      const t = Number(form.temp.value);
      if (!form.temp.value || isNaN(t)) return;
      form.temp.value = form.tempUnit.value === 'F'
        ? Math.round(t * 9 / 5 + 32)
        : Math.round((t - 32) * 5 / 9 * 2) / 2;
    };

    function updateRatio() {
      $('ratioOut').textContent = ratio(Number(form.dose.value), Number(form.water.value));
    }
    form.dose.oninput = form.water.oninput = updateRatio;

    // The photo being edited in the form: its file name, plus the shrunk image if it was just picked
    // (not uploaded until you press Save) and a link to show that image before it's uploaded.
    const formPhoto = { path: '', blob: null, previewUrl: '' };

    function drawFormPhoto() {
      const has = !!formPhoto.path;
      $('photoAdd').hidden = has;
      $('photoPreview').hidden = !has;
      const url = formPhoto.previewUrl || (has && photoUrls.get(formPhoto.path)) || '';
      if (url) $('photoImg').src = url;
      else $('photoImg').removeAttribute('src');
    }

    // Throw away a picked photo that was never saved
    function discardPickedPhoto() {
      if (formPhoto.previewUrl) URL.revokeObjectURL(formPhoto.previewUrl);
      formPhoto.blob = null;
      formPhoto.previewUrl = '';
    }

    async function pickPhoto(file) {
      if (!file) return;
      let blob;
      try { blob = await shrinkPhoto(file); }
      catch { return alert("That photo couldn't be opened. Try a JPEG or PNG."); }
      discardPickedPhoto();
      formPhoto.blob = blob;
      formPhoto.previewUrl = URL.createObjectURL(blob);
      formPhoto.path = `${user.id}/${crypto.randomUUID()}.jpg`; // a fresh name, so the old photo stays until Save
      drawFormPhoto();
    }

    $('photoAdd').onclick = $('photoChange').onclick = () => $('photoFile').click();
    $('photoFile').onchange = (e) => { pickPhoto(e.target.files[0]); e.target.value = ''; };
    $('photoRemove').onclick = () => { discardPickedPhoto(); formPhoto.path = ''; drawFormPhoto(); };
    $('dlg').addEventListener('close', discardPickedPhoto);

    // On a computer you can also drag a photo onto the form
    $('photoField').ondragover = (e) => { e.preventDefault(); $('photoField').classList.add('dragging'); };
    $('photoField').ondragleave = () => $('photoField').classList.remove('dragging');
    $('photoField').ondrop = (e) => {
      e.preventDefault();
      $('photoField').classList.remove('dragging');
      pickPhoto(e.dataTransfer.files[0]);
    };

    function openForm(brew, mode) {
      form.reset();
      $('pours').innerHTML = '';
      discardPickedPhoto();
      // "Brew again" starts without a photo: each photo belongs to one brew
      formPhoto.path = mode === 'edit' ? (brew.photo || '') : '';
      drawFormPhoto();
      editingId = mode === 'edit' ? brew.id : null;
      $('dlgTitle').textContent = mode === 'edit' ? 'Edit brew' : 'New brew';
      $('deleteBtn').style.display = $('dupBtn').style.display = mode === 'edit' ? '' : 'none';

      // New brews default to whichever temp unit you used last
      const lastUnit = brews.length ? brews[brews.length - 1].tempUnit : null;
      const data = brew || { brewDate: today(), tempUnit: lastUnit || 'C', pours: [{ t: '0:00', g: '', note: 'bloom' }], ...lastGearChoice() };
      for (const el of form.elements) {
        if (el.name && el.name in data) el.value = data[el.name] ?? '';
      }
      // Equipment dropdowns and tick boxes, filled from your Coffee Setup
      formOrig = data;
      GEAR_SELECTS.forEach(category => fillGearSelect(category, startingGear(data, category)));
      fillOthers((data.others || []).map(o => o.id));
      if (mode === 'copy') form.brewDate.value = today();
      form.querySelectorAll('.date-input').forEach(el => { el.value = toDisplayDate(el.value); checkDate(el); });
      (data.pours || []).forEach(addPourRow);
      // "Brew again" starts unscored: it's a new cup to taste
      scores = mode === 'copy' ? {} : Object.fromEntries(TASTES.map(([key]) => [key, data[key] || 0]));
      if (mode !== 'copy') scores.overall = overallOf(data);
      drawScales();
      updateRatio();
      $('dlg').showModal();
    }

    function readForm() {
      const f = Object.fromEntries(new FormData(form));
      ['dose', 'water', 'temp'].forEach(k => f[k] = f[k] === '' ? '' : Number(f[k]));
      f.roastDate = toSavedDate(f.roastDate);
      f.brewDate = toSavedDate(f.brewDate);
      f.pours = [...$('pours').children].map(row => {
        const [t, g, note] = row.querySelectorAll('input');
        return { t: t.value, g: g.value, note: note.value };
      }).filter(p => p.t || p.g || p.note);
      ['overall', ...TASTES.map(([key]) => key)].forEach(key => f[key] = scores[key] || 0);
      f.photo = formPhoto.path;
      // Equipment: each brew keeps the gear's id and a copy of its name, so the brew still
      // reads correctly if the gear is later renamed or removed from your setup
      GEAR_SELECTS.forEach(category => {
        const id = f[category + 'Id'];
        const origId = formOrig[category + 'Id'] || '', origName = formOrig[category] || '';
        const item = gear.find(g => g.id === id);
        if (id === KEEP) { f[category] = origName; f[category + 'Id'] = origId; }
        else if (!item) { f[category] = ''; f[category + 'Id'] = ''; }
        else f[category] = id === origId && origName ? origName : gearLabel(item);
      });
      f.others = [...$('othersPick').querySelectorAll('input:checked')].map(box => {
        const old = (formOrig.others || []).find(o => o.id === box.value);
        const item = gear.find(g => g.id === box.value);
        return old?.name ? old : item ? { id: item.id, name: gearLabel(item), type: item.type || '' } : null;
      }).filter(Boolean);
      return f;
    }

    form.onsubmit = () => {
      const data = readForm();

        photoUrls.set(data.photo, formPhoto.previewUrl);
        formPhoto.blob = null;
        formPhoto.previewUrl = '';
      }
      let brew, oldPhoto = '';
      if (editingId) {
        const i = brews.findIndex(b => b.id === editingId);
        oldPhoto = brews[i].photo || '';
        brew = brews[i] = { ...brews[i], ...data };

      } else {

      render();
      saveBrew(brew, photoBlob, oldPhoto);

    $('deleteBtn').onclick = () => {
      if (!confirm('Delete this brew?')) return;

    $('dupBtn').onclick = () => {

    $('closeBtn').onclick = () => $('dlg').close();
    $('addPour').onclick = () => addPourRow();
    $('newBtn').onclick = () => openForm(null, 'new');

    // ---------- Coffee Setup (your equipment) ----------

      { key: 'brewer', label: 'Brewer', plural: 'brewers', example: ['Hario V60', 'Hario', 'V60'] },

    // Makes search forgiving: "Mahlkönig V60-02" → "mahlkonigv6002" (no accents, spaces or symbols)
    const searchKey = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

    // "Hario" + "V60 02" → "Hario V60 02" (without repeating the brand if the name already starts with it)
    function gearLabel(g) {
      const brand = (g.brand || '').trim(), name = (g.name || '').trim();
      return brand && !name.toLowerCase().startsWith(brand.toLowerCase()) ? `${brand} ${name}`.trim() : name || brand;
    }
    const othersLabel = (g) => g.type ? `${gearLabel(g)} (${g.type})` : gearLabel(g);
    const activeGear = (category) => gear.filter(g => g.category === category && !g.archived)
      .sort((a, b) => gearLabel(a).localeCompare(gearLabel(b)));
    function brewsUsing(item) {
      return brews.filter(b => item.category === 'other'
        ? (b.others || []).some(o => o.id === item.id)
        : b[item.category + 'Id'] === item.id);
    }

    // The Coffee Setup page: one box per category, listing your gear
    function renderSetup() {
      $('gearGroups').innerHTML = GEAR_CATEGORIES.map(c => {
        const items = activeGear(c.key);

          <div>

              ${items.length ? items.map(g => {
                const used = brewsUsing(g).length;
                const sub = [g.type, used ? `Used in ${used} brew${used > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ');
                return `
                  <button type="button" class="panel-item" data-gear-id="${escapeHtml(g.id)}">
                    <span class="gear-name">${escapeHtml(gearLabel(g))}</span>

    $('gearGroups').onclick = (e) => {

    // ----- The add/edit equipment popup -----
    const gearForm = $('gearForm');
    const gearField = (name) => gearForm.elements.namedItem(name);
    let editingGearId = null;
    let gearSource = 'manual'; // becomes 'catalog' when a suggestion is picked
    let gearDone = null;       // when opened from the brew form: told about the new gear (or null if none)

    $('gearCategory').innerHTML = GEAR_CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join('');
    $('gearTypeList').innerHTML = GEAR_TYPES.map(t => `<option>${t}</option>`).join('');

    // "Type" (Scale, Server…) is only asked for Others, and the grey examples match the category
    function updateGearType() {
      const c = GEAR_CATEGORIES.find(c => c.key === $('gearCategory').value);
      $('gearTypeField').hidden = c.key !== 'other';
      const [search, brand, name] = c.example;
      $('gearQ').placeholder = `e.g. ${search}`;
      gearField('brand').placeholder = `e.g. ${brand}`;
      gearField('name').placeholder = `e.g. ${name}`;
    }
    $('gearCategory').onchange = () => { updateGearType(); drawGearResults(); };

    // `onDone` is for adding gear from the brew form: the category is fixed, and
    // onDone(newGear) is called once, on Save (or with null if the popup is closed without saving)
    function openGearForm(item, category, onDone = null) {
      gearForm.reset();
      gearDone = onDone;
      editingGearId = item ? item.id : null;
      gearSource = item?.source || 'manual';
      $('gearTitle').textContent = item ? 'Edit equipment' : 'Add equipment';
      $('gearDeleteBtn').hidden = !item;
      $('gearSearch').hidden = !!item; // searching is for adding new gear
      const data = item || { category };
      for (const el of gearForm.elements) {
        if (el.name && el.name in data) el.value = data[el.name] ?? '';
      }
      // Gear that past brews use stays in its category, so those brews stay linked correctly
      $('gearCategory').disabled = !!onDone || (!!item && brewsUsing(item).length > 0);
      updateGearType();
      drawGearResults();
      $('gearDlg').showModal();
    }

    // Suggestions from GEAR_CATALOG as you type; every word typed must appear.
    // Accents, spaces and symbols are ignored, so "mahlkonig" or "v60-02" still match.
    // Matches in the chosen category come first.
    function drawGearResults() {
      const words = $('gearQ').value.split(/\s+/).map(searchKey).filter(Boolean);
      $('gearResults').hidden = !words.length;
      if (!words.length) return;
      const category = $('gearCategory').value;
      const fixed = $('gearCategory').disabled; // only this category's products can be picked
      const matches = GEAR_CATALOG
        .map((p, i) => ({ ...p, i }))
        .filter(p => (!fixed || p.category === category)
          && words.every(w => searchKey(`${p.brand} ${p.name} ${p.type}`).includes(w)))
        .sort((a, b) => (b.category === category) - (a.category === category))
        .slice(0, 8);
      $('gearResults').innerHTML = matches.length
        ? matches.map(p => `
            <button type="button" class="gear-result" data-i="${p.i}">
              <span>${escapeHtml(gearLabel(p))}</span>
              <span class="gear-sub">${escapeHtml(p.type || GEAR_CATEGORIES.find(c => c.key === p.category).label)}</span>
            </button>`).join('')
        : '<div class="gear-empty">No matches. Fill in the details below instead.</div>';
    }

    // Picking a suggestion fills in the form; everything stays editable
    function pickCatalogItem(p) {
      gearField('category').value = p.category;
      gearField('brand').value = p.brand;
      gearField('name').value = p.name;
      gearField('type').value = p.type;
      gearSource = 'catalog';
      $('gearQ').value = '';
      updateGearType();
      drawGearResults();
    }

    $('gearQ').oninput = drawGearResults;
    // Enter picks the top suggestion instead of saving the form
    $('gearQ').onkeydown = (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      $('gearResults').querySelector('[data-i]')?.click();
    };
    $('gearResults').onclick = (e) => {
      const btn = e.target.closest('[data-i]');
      if (btn) pickCatalogItem(GEAR_CATALOG[btn.dataset.i]);
    };

    // After renaming gear, offer to change the name saved on past brews too
    function renameInBrews(before, item) {
      const name = gearLabel(item);
      if (name === gearLabel(before) && (item.type || '') === (before.type || '')) return;
      const used = brewsUsing(item);
      if (!used.length || !confirm(`Also change the name on ${used.length} past brew(s) to "${name}"?`)) return;
      used.forEach(b => {
        if (item.category === 'other') b.others = b.others.map(o => o.id === item.id ? { ...o, name, type: item.type || '' } : o);
        else b[item.category] = name;
      });
      cacheBrews();
      uploadBrews(used);
    }

    gearForm.onsubmit = () => {
      const f = Object.fromEntries(new FormData(gearForm));
      for (const k in f) f[k] = f[k].trim();
      let item;
      if (editingGearId) {
        const i = gear.findIndex(g => g.id === editingGearId);
        if (i < 0) return;
        const before = gear[i];
        item = gear[i] = { ...before, ...f };
        if (item.category !== 'other') item.type = '';
        renameInBrews(before, item);
      } else {
        // The category is read directly: when it's fixed (disabled), the form leaves it out
        item = { id: crypto.randomUUID(), ...f, category: $('gearCategory').value, source: gearSource, archived: false };
        if (item.category !== 'other') item.type = '';
        gear.push(item);
      }
      cacheGear();
      render();
      uploadGear([item]);
      finishGearForm(editingGearId ? null : item);
    };

    $('gearDeleteBtn').onclick = () => {
      const item = gear.find(g => g.id === editingGearId);
      if (!item) return;
      const used = brewsUsing(item).length;
      const question = used
        ? `Remove "${gearLabel(item)}" from your setup? The ${used} brew(s) that used it will still show it.`
        : `Delete "${gearLabel(item)}"?`;
      if (!confirm(question)) return;
      $('gearDlg').close();
      if (used) item.archived = true; // hidden, but kept so old brews stay linked
      else gear = gear.filter(g => g !== item);
      cacheGear();
      render();
      if (used) uploadGear([item]);
      else deleteGearOnline(item.id);
    };
    function finishGearForm(item) {
      const done = gearDone;
      gearDone = null;
      if (done) done(item);
    }
    $('gearCloseBtn').onclick = () => { finishGearForm(null); $('gearDlg').close(); };
    $('gearDlg').addEventListener('close', () => finishGearForm(null)); // e.g. closed with Esc

    // ----- Equipment in the brew form -----
    const option = (value, text) => `<option value="${escapeHtml(value)}">${escapeHtml(text)}</option>`;

    // New brews start with the gear from your last brew (if it's still in your setup)
    function lastGearChoice() {
      const last = brews[brews.length - 1] || {};
      const active = (id) => gear.some(g => g.id === id && !g.archived);
      const choice = { others: (last.others || []).filter(o => active(o.id)).map(o => ({ id: o.id })) };
      GEAR_SELECTS.forEach(category => {
        if (active(last[category + 'Id'])) choice[category + 'Id'] = last[category + 'Id'];
      });
      return choice;
    }

    // Which dropdown choice a brew starts with. Brews from before Coffee Setup only
    // have a typed name: pick the gear with that name if there is one, else keep the name.
    function startingGear(data, category) {
      if (data[category + 'Id']) return data[category + 'Id'];
      if (!data[category]) return '';
      return activeGear(category).find(g => gearLabel(g) === data[category])?.id || KEEP;
    }

    // Fill one equipment dropdown and choose `selected` (a gear id, KEEP or '').
    // If this brew's gear is no longer in your setup, it still gets a choice, so saving doesn't lose it.
    function fillGearSelect(category, selected) {
      const c = GEAR_CATEGORIES.find(c => c.key === category);
      const sel = form.elements.namedItem(category + 'Id');
      const items = activeGear(category);
      const origId = formOrig[category + 'Id'] || '', origName = formOrig[category] || '';
      const old = gear.find(g => g.id === origId);
      let extra = '';
      if (!items.some(g => g.id === origId)) {
        if (old) extra = option(old.id, `${origName || gearLabel(old)} (removed from setup)`);
        else if (origName) extra = option(KEEP, `${origName} (not in your setup)`);
      }
      sel.innerHTML = option('', items.length ? 'None' : `No ${c.plural} yet`)
        + items.map(g => option(g.id, gearLabel(g))).join('')
        + extra
        + option(ADD, `+ Add a ${c.label.toLowerCase()}…`);
      sel.value = selected;
      if (sel.selectedIndex < 0) sel.value = selected === origId && origName ? KEEP : '';
      sel.dataset.value = sel.value; // to go back to if adding new gear is cancelled
    }

    // "+ Add…" in the brew form opens the add-equipment popup on top; the new gear is then chosen
    GEAR_SELECTS.forEach(category => {
      const sel = form.elements.namedItem(category + 'Id');
      sel.onchange = () => {
        if (sel.value !== ADD) { sel.dataset.value = sel.value; return; }
        const before = sel.dataset.value;
        sel.value = before; // until the new gear is saved
        openGearForm(null, category, item => fillGearSelect(category, item ? item.id : before));
      };
    });

    // The Others tick boxes; `checked` is a list of gear ids
    function fillOthers(checked) {
      const items = activeGear('other');
      const gone = (formOrig.others || []).filter(o => o.name && !items.some(g => g.id === o.id));
      const box = (id, text) =>
        `<label class="check"><input type="checkbox" value="${escapeHtml(id)}"${checked.includes(id) ? ' checked' : ''}>${escapeHtml(text)}</label>`;
      $('othersPick').innerHTML = (items.map(g => box(g.id, othersLabel(g))).join('')
        + gone.map(o => box(o.id, `${o.name} (removed from setup)`)).join(''))
        || '<span class="gear-sub">No other gear yet</span>';
    }
    $('addOther').onclick = () => {
      const checked = [...$('othersPick').querySelectorAll('input:checked')].map(box => box.value);
      openGearForm(null, 'other', item => { if (item) fillOthers([...checked, item.id]); });
    };

    // ---------- Floating + button (phones) ----------
    function setFabOpen(open) {
      $('fab').classList.toggle('open', open);
      $('fabBtn').setAttribute('aria-expanded', open);
      $('fabBtn').setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      document.querySelectorAll('.fab-item').forEach(item => item.tabIndex = open ? 0 : -1);
    }
    $('fabBtn').onclick = () => setFabOpen(!$('fab').classList.contains('open'));
    $('fabNew').onclick = () => { setFabOpen(false); openForm(null, 'new'); };
    $('fabImport').onclick = () => { setFabOpen(false); $('importFile').click(); };

    // ---------- Search & filter panel ----------
    function setFiltersOpen(open) {
      $('filterPanel').classList.toggle('open', open);
      $('filterPanel').inert = !open; // while folded away, its fields can't be tabbed into
      $('filterBtn').setAttribute('aria-expanded', open);
      // With a mouse, jump straight to the search box (skipped on phones so the keyboard doesn't pop up)
      if (open && matchMedia('(pointer: fine)').matches) $('q').focus({ preventScroll: true });
    }
    $('filterBtn').onclick = () => setFiltersOpen(!$('filterPanel').classList.contains('open'));

    // ---------- Pages & bottom navigation bar ----------
    // The page you're on is kept in the address (#log, #setup, #account), so the back
    // button and reloading the page work as you'd expect. Anything else shows the Brew Log.
    const PAGES = ['log', 'setup', 'account'];
    const scrollPositions = {};
    let currentPage = null;

    function showPage() {
      const hash = location.hash.slice(1);
      const page = PAGES.includes(hash) ? hash : 'log';
      if (currentPage) scrollPositions[currentPage] = scrollY;
      PAGES.forEach(p => {
        $(`page-${p}`).hidden = p !== page;
        if (p === page) $(`tab-${p}`).setAttribute('aria-current', 'page');
        else $(`tab-${p}`).removeAttribute('aria-current');
      });
      setFabOpen(false);
      // Come back to where you were on each page (e.g. halfway down the brew list)
      if (page !== currentPage) scrollTo(0, scrollPositions[page] || 0);
      currentPage = page;
    }
    window.addEventListener('hashchange', showPage);

    // Tapping anywhere else, or pressing Escape, closes the + menu
    document.addEventListener('click', (e) => {
      if (!$('fab').contains(e.target)) setFabOpen(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setFabOpen(false);
    });
    $('list').onclick = (e) => {
      const item = e.target.closest('[data-id]');
      if (item) openForm(brews.find(b => b.id === item.dataset.id), 'edit');
    };
    ['q', 'fBrewer', 'fRating', 'sort'].forEach(id => $(id).oninput = render);

    // ---------- Backup: export / import ----------
    $('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(brews, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `pourover-log-${today()}.json`;
      a.click();
    };
    $('importBtn').onclick = () => $('importFile').click();
    $('importFile').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const incoming = JSON.parse(await file.text());
        const known = new Set(brews.map(b => b.id));
        const added = incoming.filter(b => b.id && !known.has(b.id));
        brews.push(...added);
        cacheBrews();
        render();
        if (added.length) uploadBrews(added);
        alert(`Imported ${added.length} brew(s).`);
      } catch {
        alert('That file could not be read.');
      }
      e.target.value = '';
    };
  </script>
</body>
</html>
